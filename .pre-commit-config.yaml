# pre-commit.ci configuration.
# Runs the hooks below on every PR and keeps them up to date, replacing the
# in-CI `pre-commit` job once the pre-commit.ci GitHub App is enabled on the repo.
ci:
  autofix_commit_msg: "style: auto-fixes from pre-commit hooks"
  # Prefer proposing over pushing: review pre-commit.ci's fixes like any PR.
  autofix_prs: false
  autoupdate_branch: ""
  autoupdate_commit_msg: "chore(pre-commit): autoupdate hook versions"
  autoupdate_schedule: weekly
  # zizmor audits GitHub Actions; run it in CI where it has repo/network context
  # rather than in pre-commit.ci's sandbox.
  skip: [zizmor]
  submodules: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: file-contents-sorter
      - id: fix-byte-order-marker
      - id: forbid-new-submodules
      - id: forbid-submodules
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: requirements-txt-fixer
      - id: sort-simple-yaml
      - id: trailing-whitespace

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.28.0
    hooks:
      - id: pyproject-fmt

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.74
    hooks:
      - id: ty

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: '0.26'
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
    - id: zizmor
