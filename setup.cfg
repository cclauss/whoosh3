[wheel]
universal = True

[build_sphinx]
build-dir = docs/build
source-dir = docs/source

[upload_sphinx]
upload-dir = docs/build/html

[sdist]
formats = zip,gztar

[aliases]
push = sdist bdist_wheel twine upload
pushdocs = build_sphinx upload_sphinx

[tool:pytest]
; --tb= traceback print mode (long/short/line/native/no)
addopts = -rs --tb=short

norecursedirs = .hg .tox _build tmp* env* benchmark stress
minversion = 3.0
python_files = test_*.py
filterwarnings =
    ; CPython 3.12+ raises a DeprecationWarning when fork() is used from a
    ; multi-threaded process. MpWriter uses the interpreter-default start
    ; method (fork on POSIX) unless the caller passes
    ; start_method="spawn"/"forkserver". That default-fork path is
    ; intentional and explicitly tested, so silence the advisory here rather
    ; than let it drown out actionable warnings. Users who want a
    ; warning-free / forward-compatible path can select a non-fork start
    ; method. See https://github.com/priya-sundaram-dev/whoosh/issues/113
    ignore:This process .* is multi-threaded, use of fork\(\):DeprecationWarning

[tool.coverage.run]
source = ["src/whoosh"]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=lcov:lcov.info --cov-report=term"
